
services:
  postgres:
    image: postgres:17
    container_name: market-exchange-postgres
    environment:
      POSTGRES_DB: market_exchange
      POSTGRES_USER: market_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market_user -d market_exchange"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: market-exchange-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/market_exchange
      SPRING_DATASOURCE_USERNAME: market_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
